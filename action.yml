name: AgentForge Guard
description: Validate an agentforge.yaml policy, run afg doctor, and upload the audit report as SARIF.
branding:
  icon: shield
  color: gray-dark
inputs:
  working-directory:
    description: Directory that contains (or is below) agentforge.yaml.
    default: "."
  upload-sarif:
    description: Upload the SARIF audit report to GitHub Code Scanning.
    default: "true"
  sarif-file:
    description: Where to write the SARIF report.
    default: afg-audit.sarif
outputs:
  sarif-file:
    description: Path of the SARIF report.
    value: ${{ steps.report.outputs.sarif-file }}
runs:
  using: composite
  steps:
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
    - name: Build afg from this action's source
      shell: bash
      run: cargo install --locked --path "${GITHUB_ACTION_PATH}/crates/afg-cli" --root "${RUNNER_TEMP}/afg"
    - name: Validate policy
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        AFG_NO_TTY: "1"
      run: |
        export PATH="${RUNNER_TEMP}/afg/bin:${PATH}"
        afg policy validate
        afg doctor
    - name: Audit report
      id: report
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        AFG_NO_TTY: "1"
      run: |
        export PATH="${RUNNER_TEMP}/afg/bin:${PATH}"
        afg audit report --format sarif --output "${{ inputs.sarif-file }}"
        afg audit report --format json
        echo "sarif-file=${{ inputs.working-directory }}/${{ inputs.sarif-file }}" >> "${GITHUB_OUTPUT}"
    - name: Upload SARIF
      if: inputs.upload-sarif == 'true'
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: ${{ steps.report.outputs.sarif-file }}
        category: agentforge-guard
