name: Release

# Runs on version tags (v1.2.3). Builds signed binaries with an SBOM and
# SLSA build provenance, creates a GitHub Release (with install.sh), and
# publishes to crates.io and npm. Each registry is skipped when its token
# secret (CARGO_REGISTRY_TOKEN, NPM_TOKEN) is not configured.
on:
  workflow_dispatch:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read
  
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches the workspace version
        run: |
          v=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} != v$v"; exit 1; }
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace --locked
      - run: cargo package --workspace --locked

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, target: aarch64-apple-darwin }
          - { os: macos-15-intel, target: x86_64-apple-darwin }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked -p agentforge-guard --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          name="afg-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          bin=target/${{ matrix.target }}/release/afg
          [ -f "$bin.exe" ] && bin="$bin.exe"
          cp "$bin" README.md LICENSE-MIT LICENSE-APACHE "dist/$name/"
          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then 7z a "$name.zip" "$name" >/dev/null; else tar czf "$name.tar.gz" "$name"; fi
          rm -r "$name"
      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.target }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write      # create the GitHub Release
      id-token: write      # keyless cosign signing and build attestations
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: dtolnay/rust-toolchain@stable
      - name: SBOM (CycloneDX)
        run: |
          cargo install cargo-cyclonedx --locked
          cargo cyclonedx --format json --all
          mkdir -p dist/sbom && find crates -name '*.cdx.json' -exec cp {} dist/sbom/ \;
          tar czf "dist/afg-${GITHUB_REF_NAME}-sbom.tar.gz" -C dist sbom && rm -r dist/sbom
      - name: Install script
        run: cp install.sh dist/install.sh
      - name: Checksums
        run: cd dist && sha256sum -- * > SHA256SUMS
      - uses: sigstore/cosign-installer@v3
      - name: Sign (keyless, Sigstore)
        run: |
          cd dist
          for f in *; do cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"; done
      - name: SLSA build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: "dist/afg-*"
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=""; case "${GITHUB_REF_NAME}" in *-*) pre="--prerelease";; esac
          gh release create "${GITHUB_REF_NAME}" dist/* --verify-tag --generate-notes $pre --title "AgentForge Guard ${GITHUB_REF_NAME}"

  publish:
    needs: release
    runs-on: ubuntu-latest
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish to crates.io (skipped without a token)
        run: |
          if [ -z "${CARGO_REGISTRY_TOKEN}" ]; then echo "CARGO_REGISTRY_TOKEN not set; skipping publish"; exit 0; fi
          cargo publish --workspace --locked

  npm:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write      # npm provenance
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Publish to npm (skipped without a token)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN}" ]; then echo "NPM_TOKEN not set; skipping npm publish"; exit 0; fi
          version="${GITHUB_REF_NAME#v}"
          tag=latest; case "$version" in *-*) tag=next;; esac
          mkdir dist
          gh release download "${GITHUB_REF_NAME}" -R "${GITHUB_REPOSITORY}" -D dist -p 'afg-*.tar.gz' -p 'afg-*.zip' -p SHA256SUMS
          node packaging/npm/assemble.mjs dist "$version" out
          # Idempotent, so a rerun can finish a partial publication: skip a package only when
          # the registry confirms this exact version exists. A 404 means "not yet published";
          # any other lookup error, and every publish error, fails the job.
          publish() {
            name=$(node -p 'require(process.argv[1]).name' "$1/package.json")
            if found=$(npm view "$name@$version" version 2>"$RUNNER_TEMP/view.err"); then
              if [ "$found" = "$version" ]; then echo "$name@$version already published; skipping"; return 0; fi
            elif ! grep -q E404 "$RUNNER_TEMP/view.err"; then
              cat "$RUNNER_TEMP/view.err" >&2; echo "registry lookup failed for $name@$version" >&2; return 1
            fi
            npm publish "$1" --provenance --access public --tag "$tag"
          }
          # Explicit ./ paths: npm reads `out/x` as a GitHub shorthand, not a directory.
          # Platform packages first, so the launcher's optionalDependencies resolve.
          for d in ./out/agentforge-guard-*; do publish "$d"; done
          publish ./out/agentforge-guard
