name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Live toolchain tests (crates/afg-cli/tests/toolchains.rs) skip without these.
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - run: cargo test --workspace
      - name: Docker isolation tests (Linux reference runner)
        if: runner.os == 'Linux'
        run: cargo test --workspace -- --ignored
        env:
          AFG_NO_TTY: "1"

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  demos:
    # README demos 2 and 3 on the Linux reference runner (disposable VM).
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p agentforge-guard
      - run: docker pull debian:stable-slim
      - run: scripts/ci-demos.sh target/debug/afg

  action:
    # Self-test of the composite action (action.yml) on the example repository.
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with:
          working-directory: examples/polyglot-monorepo
          upload-sarif: "false"

  packages:
    # TypeScript packages: generated policy types must match the schema (T11.1).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm -r run check
      - name: npm distribution packaging
        run: node --test packaging/npm/test/*.test.mjs
      - name: install.sh (fake local release) and shellcheck
        run: |
          shellcheck -s sh install.sh scripts/test-install.sh
          sh scripts/test-install.sh
