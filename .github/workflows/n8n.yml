name: n8n Community Node

on:
  pull_request:
  push:
    branches: [main, milestone/n8n-community-node]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/n8n-nodes-agentforge-guard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: packages/n8n-nodes-agentforge-guard/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked -p agentforge-guard
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm run lint
      - run: npm test
      - run: npm audit --omit=dev
      - run: npm pack --dry-run --ignore-scripts
      - name: Install pinned self-hosted n8n runtime
        run: npm install --prefix "$RUNNER_TEMP/afg-n8n" --no-audit --no-fund n8n@2.49.6
      - name: Execute packed node in real n8n workflows
        run: npm test -- tests/runtime-smoke.cjs
        env:
          AFG_N8N_BINARY: ${{ runner.temp }}/afg-n8n/node_modules/.bin/n8n
      - name: Docker isolation suite
        run: cargo test --workspace --locked -- --ignored
